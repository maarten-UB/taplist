<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Taplist</title>

  <style>
    body {
      background: #1a120d;
      color: #f5e9dc;
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    .beer {
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .beer-name {
      font-size: 32px;
      font-weight: bold;
    }

    .beer-style {
      font-size: 22px;
      opacity: 0.85;
    }

    .beer-abv,
    .beer-price {
      font-size: 20px;
    }
  </style>
</head>

<body>

<div id="menu">Laddar...</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5ElTRzlAegjM_CwuIhx1OOC8r68XUQfM691XaDxw51y8vAv6plXOZvAMjebgf4n-T97FuImVbjvlU/pub?gid=445956250&single=true&output=csv";

async function loadBeers() {
  const res = await fetch(CSV_URL);
  const text = await res.text();

  const rows = text.split("\n").map(r => r.split(","));

  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  // Antag kolumner:
  // A = namn, B = stil, C = ABV, D = pris

  rows.slice(1).forEach(row => {
    if (!row[0]) return;

    const beer = {
      name: row[2],
      style: row[3],
      abv: row[4],
      price: row[5]
    };

    const div = document.createElement("div");
    div.className = "beer";

    div.innerHTML = `
      <div class="beer-name">${beer.name}</div>
      <div class="beer-style">${beer.style}</div>
      <div class="beer-abv">${beer.abv}</div>
      <div class="beer-price">${beer.price}</div>
    `;

    menu.appendChild(div);
  });
}

loadBeers();

// Auto-refresh var 60 sek
setInterval(loadBeers, 60000);
</script>

</body>
</html>
