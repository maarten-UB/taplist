<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tap List</title>

<style>
body {
  margin: 0;
  background: url("https://raw.githubusercontent.com/maarten-UB/taplist/main/joshua-bartell-6vvIBTvL90A-unsplash.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #f5f1e8;
  font-family: sans-serif;
  cursor: none;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(20, 12, 8, 0.65);
  z-index: -1;
}

.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 25px;
  padding: 50px;
  height: 100vh;
  box-sizing: border-box;
}

.beer {
  display: flex;
  align-items: center;
  gap: 20px;
}

.beer img {
  width: 90px;
  height: 90px;
  object-fit: contain;
}

.text {
  display: flex;
  flex-direction: column;
}

.name {
  font-size: 34px;
  font-weight: bold;
  line-height: 1.1;
}

.meta {
  font-size: 20px;
  opacity: 0.85;
}
</style>

</head>
<body>

<div class="container" id="menu"></div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5ElTRzlAegjM_CwuIhx1OOC8r68XUQfM691XaDxw51y8vAv6plXOZvAMjebgf4n-T97FuImVbjvlU/pub?gid=445956250&single=true&output=csv";

async function loadMenu() {
  const res = await fetch(sheetURL);
  const text = await res.text();

  const rows = text.split("\n").slice(1);
  const container = document.getElementById("menu");
  container.innerHTML = "";

  rows.forEach(row => {
    if (!row.trim()) return;

    // Klarar både , och ;
    const cols = row.includes(";") ? row.split(";") : row.split(",");

    const [tap, active, name, style, abv, price, image] = cols;

    if (active !== "TRUE") return;

    const div = document.createElement("div");
    div.className = "beer";

    div.innerHTML = `
      <img src="${image.trim()}">
      <div>
        <div class="name">${tap}. ${name}</div>
        <div class="meta">${style} • ${abv} • ${price}</div>
      </div>
    `;

    container.appendChild(div);
  });
}

loadMenu();
setInterval(loadMenu, 30000);
</script>

</body>
</html>
