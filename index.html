<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Taplist</title>

  <style>
    body {
      background: #1a120d;
      color: #f5e9dc;
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    .beer {
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .beer-name {
      font-size: 32px;
      font-weight: bold;
    }

    .beer-style {
      font-size: 22px;
      opacity: 0.85;
    }

    .beer-abv,
    .beer-price {
      font-size: 20px;
    }

    /* DEBUG (valfri) */
    .label {
      opacity: 0.6;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="menu"></div>

  <script>
    // TESTDATA (ersätt senare med Sheets)
    const beers = [
      {
        name: "Road Trip",
        style: "Alkoholfri IPA",
        abv: "0,3%",
        price: "65 kr"
      },
      {
        name: "Hazy Days",
        style: "New England IPA",
        abv: "6,5%",
        price: "89 kr"
      }
    ];

    const menu = document.getElementById("menu");

    beers.forEach(beer => {
      const div = document.createElement("div");
      div.className = "beer";

      div.innerHTML = `
        <div class="beer-name">${beer.name}</div>
        <div class="beer-style">${beer.style}</div>
        <div class="beer-abv">${beer.abv}</div>
        <div class="beer-price">${beer.price}</div>
      `;

      menu.appendChild(div);
    });
  </script>

</body>
</html>
