<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tap List</title>

<style>
body {
  margin: 0;
  background: url("https://raw.githubusercontent.com/maarten-UB/taplist/main/joshua-bartell-6vvIBTvL90A-unsplash.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #f5f1e8;
  font-family: sans-serif;
  cursor: none;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(20, 12, 8, 0.65);
  z-index: -1;
}

.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 12px;
  padding: 40px;
  height: 100vh;
  box-sizing: border-box;
}

.beer img {
  width: 110px;      /* 🔥 fast bredd istället */
  height: auto;
  flex-shrink: 0;
}

.beer {
  display: flex;
  align-items: center;
  gap: 15px;
  width: 100%;
}

.text {
  flex: 1;
  min-width: 0;
}
.name {
  font-size: 36px;
  font-weight: bold;
  color: #f5d76e; /* gul headline */
  line-height: 1.1;
}

.meta {
  font-size: 26px;
  color: #ffffff;
}
</style>

</head>
<body>

<div class="container" id="menu"></div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5ElTRzlAegjM_CwuIhx1OOC8r68XUQfM691XaDxw51y8vAv6plXOZvAMjebgf4n-T97FuImVbjvlU/pub?gid=445956250&single=true&output=csv";

async function loadMenu() {
  const res = await fetch(sheetURL);
  const text = await res.text();

  const rows = text.split("\n").slice(1).filter(r => r.trim());

  // Parse
  let beers = rows.map(row => {
    const cols = row.includes(";") ? row.split(";") : row.split(",");
    const [tap, active, name, style, abv, price, image] = cols;
    return { tap, active, name, style, abv, price, image };
  });

  // Filtrera aktiva
  beers = beers.filter(b => b.active === "TRUE");

  // Sortera efter tap-nummer
  beers.sort((a, b) => Number(a.tap) - Number(b.tap));

  // 🔥 Kolumnvis ordning (1–6, 7–12, 13–18)
  const columns = [[], [], []];
  beers.forEach((beer, i) => {
    const colIndex = Math.floor(i / 6);
    if (columns[colIndex]) columns[colIndex].push(beer);
  });

  // Flatten i rätt ordning för grid
  const ordered = [];
  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 3; col++) {
      if (columns[col][row]) {
        ordered.push(columns[col][row]);
      }
    }
  }

  const container = document.getElementById("menu");
  container.innerHTML = "";

  ordered.forEach(beer => {
    const div = document.createElement("div");
    div.className = "beer";

    div.innerHTML = `
      <img src="${beer.image.trim()}">
      <div class="text">
        <div class="name">${beer.name}</div>
        <div class="meta">${beer.style} • ${beer.abv} • ${beer.price}</div>
      </div>
    `;

    container.appendChild(div);
  });
}

loadMenu();
setInterval(loadMenu, 30000);
</script>

</body>
</html>
