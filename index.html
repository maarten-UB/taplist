<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tap List</title>

<style>
body {
  margin: 0;
  background: url("https://raw.githubusercontent.com/maarten-UB/taplist/main/joshua-bartell-6vvIBTvL90A-unsplash.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #f5f1e8;
  font-family: sans-serif;
  cursor: none;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(20, 12, 8, 0.65);
  z-index: -1;
}

.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 12px;
  padding: 40px;
  height: 100vh;
  box-sizing: border-box;
}

.beer img {
  width: 160px;
  height: auto;
  flex-shrink: 0;
  object-fit: contain;
}

.beer {
  display: flex;
  align-items: center;
  gap: 15px;
  width: 100%;
}

.text {
  flex: 1;
  min-width: 0;
}

.name {
  font-size: 40px;
  font-weight: bold;
  color: #f5d76e;
  line-height: 1.1;
}

.meta {
  font-size: 26px;
  color: #ffffff;
  margin-top: 2px;
}
.price {
  font-size: 26px;
  color: #f5d76e;
  margin-top: 4px;
}
</style>


</head>
<body>

<div class="container" id="menu"></div>

<!-- ✅ CSV-parser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5ElTRzlAegjM_CwuIhx1OOC8r68XUQfM691XaDxw51y8vAv6plXOZvAMjebgf4n-T97FuImVbjvlU/pub?gid=445956250&single=true&output=csv";

async function loadMenu() {
  const res = await fetch(sheetURL + "&t=" + Date.now(), {
    cache: "no-store"
  });
  const text = await res.text();

  // ✅ RIKTIG CSV parsing
  const parsed = Papa.parse(text, {
    skipEmptyLines: true
  });

  let beers = parsed.data.slice(1).map(cols => {
    const [tap, active, name, style, abv, price, image] = cols;
    return {
      tap,
      active,
      name,
      style,
      abv,
      price,
      image
    };
  });

  // Skapa 18 fasta positioner
const slots = Array(18).fill(null);

// Placera öl på rätt tappnummer
beers.forEach(beer => {
  if (beer.active === "TRUE") {
    const index = Number(beer.tap) - 1;
    if (index >= 0 && index < 18) {
      slots[index] = beer;
    }
  }
});

// Bygg grid i rätt kolumnordning
const ordered = [];

for (let row = 0; row < 6; row++) {
  for (let col = 0; col < 3; col++) {
    const index = col * 6 + row;
    ordered.push(slots[index]);
  }
}

  const container = document.getElementById("menu");
  container.innerHTML = "";

  ordered.forEach(beer => {
  const div = document.createElement("div");
  div.className = "beer";

  // 👉 Om slot är tom → rendera tom ruta
  if (!beer) {
    container.appendChild(div);
    return;
  }

  // 👉 annars rendera öl
  const meta = [beer.style, beer.abv].filter(Boolean).join(" • ");

  div.innerHTML = `
    <img src="${(beer.image || "").trim()}">
    <div class="text">
      <div class="name">${beer.name || ""}</div>
      <div class="meta">${meta}</div>
      <div class="price">${beer.price || ""}</div>
    </div>
  `;

  container.appendChild(div);
});
}

loadMenu();
setInterval(loadMenu, 30000);
</script>

</body>
</html>
