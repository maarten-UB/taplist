<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tap List</title>
<style>
body {
  margin: 0;
  background: #1a120d;
  color: #f5f1e8;
  font-family: sans-serif;
}
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  padding: 60px;
}
.beer {
  display: flex;
  align-items: center;
  gap: 20px;
}
.beer img {
  width: 80px;
  height: 80px;
  object-fit: contain;
}
.name {
  font-size: 50px;
  font-weight: bold;
}
.meta {
  font-size: 30px;
  opacity: 0.8;
}
</style>
</head>
<body>

<div class="container" id="menu"></div>

<script>
document.getElementById("menu").innerHTML = "Det funkar!";
</script>

</body>
</html>
