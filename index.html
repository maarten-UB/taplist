<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tap List</title>
<style>
body {
  margin: 0;
  background: #1a120d;
  color: #f5f1e8;
  font-family: sans-serif;
}
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  padding: 60px;
}
.beer {
  display: flex;
  align-items: center;
  gap: 20px;
}
.beer img {
  width: 80px;
  height: 80px;
  object-fit: contain;
}
.name {
  font-size: 50px;
  font-weight: bold;
}
.meta {
  font-size: 30px;
  opacity: 0.8;
}
</style>
</head>
<body>

<div class="container" id="menu"></div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5ElTRzlAegjM_CwuIhx1OOC8r68XUQfM691XaDxw51y8vAv6plXOZvAMjebgf4n-T97FuImVbjvlU/pub?gid=445956250&single=true&output=csv";

async function loadMenu() {
  const res = await fetch(sheetURL);
  const text = await res.text();
  const rows = text.split("\n").slice(1);

  const container = document.getElementById("menu");
  container.innerHTML = "";

  rows.forEach(row => {
    const [tap, active, name, style, abv, price, image] = row.split(",");

    if (active !== "TRUE") return;

    const div = document.createElement("div");
    div.className = "beer";

    div.innerHTML = `
      <img src="${image}">
      <div>
        <div class="name">${tap}. ${name}</div>
        <div class="meta">${style} • ${abv} • ${price}</div>
      </div>
    `;

    container.appendChild(div);
  });
}

loadMenu();
setInterval(loadMenu, 30000); // uppdaterar var 30 sek
</script>

</body>
</html>
